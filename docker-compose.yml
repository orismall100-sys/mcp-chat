services:
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./mcp-server/.env
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:3001/mcp"]
      interval: 5s
      timeout: 5s
      retries: 5

  chat-backend:
    build:
      context: ./chat-backend
    ports:
      - "8000:8000"
    env_file:
      - ./chat-backend/.env
    environment:
      - MCP_SERVER_URL=http://mcp-server:3001/mcp
      - CORS_ORIGIN=http://localhost
    depends_on:
      mcp-server:
        condition: service_healthy

  chat-frontend:
    build:
      context: ./chat-frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - chat-backend
