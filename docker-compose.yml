services:
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    ports:
      - "${MCP_PORT}:${MCP_PORT}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:${MCP_PORT}/mcp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-backend:
    build:
      context: ./chat-backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file:
      - .env
    depends_on:
      mcp-server:
        condition: service_healthy

  chat-frontend:
    build:
      context: ./chat-frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - chat-backend
